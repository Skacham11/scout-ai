services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scout-ai-db
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout_ai
    ports:
      - "5432:5432"
    volumes:
      - scout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout_ai"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  scout_pgdata:
